name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: PR Details
      uses: actions/github-script@v6
      with:
        script: |
          const pr = context.payload.pull_request;
          console.log(`PR #${pr.number}: ${pr.title}`);
          console.log(`Author: ${pr.user.login}`);
          console.log(`Base: ${pr.base.ref} <- Head: ${pr.head.ref}`);
          console.log(`Changed files: ${pr.changed_files}`);
  
  validate-pr:
    name: Validate PR Requirements
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Check PR Title
      uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert
    
    - name: Check PR Size
      uses: actions/github-script@v6
      with:
        script: |
          const pr = context.payload.pull_request;
          const maxChanges = 500;
          
          if (pr.additions + pr.deletions > maxChanges) {
            core.warning(`Large PR detected: ${pr.additions + pr.deletions} changes. Consider breaking it down.`);
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `⚠️ This PR contains ${pr.additions + pr.deletions} changes. Large PRs are harder to review. Consider breaking it into smaller, focused PRs.`
            });
          }
    
    - name: Check for merge conflicts
      run: |
        git fetch origin ${{ github.base_ref }}
        if ! git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q "<<<<<<< "; then
          echo "✅ No merge conflicts detected"
        else
          echo "❌ Merge conflicts detected"
          exit 1
        fi
  
  check-files:
    name: File Checks
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check for sensitive data
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --debug --only-verified
    
    - name: Check file permissions
      run: |
        # Check for executable files that shouldn't be
        find . -type f -executable \
          -not -path "./.git/*" \
          -not -name "*.sh" \
          -not -name "*.py" \
          | while read file; do
            echo "Warning: Unexpected executable file: $file"
          done
    
    - name: Check for large files
      run: |
        # Files larger than 1MB
        find . -type f -size +1M \
          -not -path "./.git/*" \
          -not -path "./node_modules/*" \
          -not -path "./venv/*" \
          | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "Warning: Large file detected: $file ($size)"
          done
  
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [validate-pr]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Quick Tests
      id: tests
      continue-on-error: true
      run: |
        # Backend tests
        cd backend
        pip install -r requirements.txt
        python -m pytest tests/unit/test_config.py -v --tb=short > backend-test.log 2>&1 || true
        cd ..
        
        # Frontend build test
        cd frontend
        npm ci --prefer-offline --no-audit
        npm run type-check > frontend-test.log 2>&1 || true
        cd ..
    
    - name: Generate test report
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          let backendStatus = '✅';
          let frontendStatus = '✅';
          
          try {
            const backendLog = fs.readFileSync('backend/backend-test.log', 'utf8');
            if (backendLog.includes('FAILED')) backendStatus = '❌';
          } catch (e) {
            backendStatus = '⚠️';
          }
          
          try {
            const frontendLog = fs.readFileSync('frontend/frontend-test.log', 'utf8');
            if (frontendLog.includes('error')) frontendStatus = '❌';
          } catch (e) {
            frontendStatus = '⚠️';
          }
          
          const comment = `## 🧪 Test Summary
          
          | Component | Status |
          |-----------|---------|
          | Backend Tests | ${backendStatus} |
          | Frontend Build | ${frontendStatus} |
          
          <details>
          <summary>View Details</summary>
          
          Run the following workflows for comprehensive testing:
          - Backend Tests workflow
          - Frontend Tests workflow
          - Code Quality workflow
          
          </details>`;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            body: comment
          });
  
  auto-assign:
    name: Auto Assign Reviewers
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    
    steps:
    - name: Auto assign reviewers
      uses: actions/github-script@v6
      with:
        script: |
          const pr = context.payload.pull_request;
          
          // Define review teams based on changed files
          const reviewerMap = {
            'backend/': ['backend-team'],
            'frontend/': ['frontend-team'],
            '.github/': ['devops-team'],
            'docker': ['devops-team']
          };
          
          // Get changed files
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number
          });
          
          const reviewers = new Set();
          
          files.forEach(file => {
            Object.keys(reviewerMap).forEach(path => {
              if (file.filename.startsWith(path)) {
                reviewerMap[path].forEach(r => reviewers.add(r));
              }
            });
          });
          
          if (reviewers.size > 0) {
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                team_reviewers: Array.from(reviewers)
              });
            } catch (e) {
              console.log('Could not assign reviewers:', e.message);
            }
          }
  
  label-pr:
    name: Auto Label PR
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    
    steps:
    - name: Label based on files changed
      uses: actions/labeler@v4
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler.yml
    
    - name: Label based on PR size
      uses: actions/github-script@v6
      with:
        script: |
          const pr = context.payload.pull_request;
          const labels = [];
          
          if (pr.additions + pr.deletions < 10) {
            labels.push('size/XS');
          } else if (pr.additions + pr.deletions < 50) {
            labels.push('size/S');
          } else if (pr.additions + pr.deletions < 200) {
            labels.push('size/M');
          } else if (pr.additions + pr.deletions < 500) {
            labels.push('size/L');
          } else {
            labels.push('size/XL');
          }
          
          if (labels.length > 0) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: labels
            });
          }
  
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high
        deny-licenses: GPL-3.0, LGPL-2.1, AGPL-3.0
        comment-summary-in-pr: true